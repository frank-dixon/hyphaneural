<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyphaneural — map demo</title>
  <meta name="description" content="Quiet Protomol mycelial organism map — pan, zoom, see the strand.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/hyphaneural.css">
</head>
<body>
<div class="map-app" id="map-app">
  <canvas id="hypha-canvas"></canvas>

  <div class="chrome top-bar">
    <div class="brand">Hyphaneural</div>
    <div class="chrome-actions">
      <button type="button" id="btn-compare" title="Select two organisms">Compare</button>
      <button type="button" id="btn-calm" title="Hide chrome">Calm</button>
      <a href="https://github.com/frank-dixon/hyphaneural" title="Source on GitHub">Source</a>
    </div>
  </div>

  <div class="compare-banner" id="compare-banner"></div>

  <div class="chrome readout" id="readout">x 0  y 0  ×1.00</div>
  <div class="chrome hint">Pan · scroll to zoom · hyphae reach outward · static demo</div>

  <aside class="chamber" id="chamber" aria-label="Organism chamber">
    <button type="button" class="chamber-close" id="btn-close-chamber" aria-label="Close">×</button>
    <div class="chamber-head">
      <h2 id="chamber-title"></h2>
      <div class="sci" id="chamber-sci"></div>
    </div>
    <div class="chamber-body" id="chamber-body"></div>
  </aside>
</div>
<script>

  window.HYPHA_GENES = {"ACT1": {"id": "ACT1", "name": "Actin", "role": "Cytoskeleton filament; shared across fungi", "steps": [{"stage": "DNA", "label": "ACT1 locus", "seq_hint": "ATGTGTGAC\u2026"}, {"stage": "RNA", "label": "actin mRNA", "seq_hint": "AUGUGUGAC\u2026"}, {"stage": "Protein", "label": "actin monomer", "seq_hint": "MCDD\u2026"}]}, "EF1A": {"id": "EF1A", "name": "Elongation factor 1-\u03b1", "role": "Translation machinery; highly conserved", "steps": [{"stage": "DNA", "label": "EF1A locus", "seq_hint": "ATGGGTAAA\u2026"}, {"stage": "RNA", "label": "EF1A mRNA", "seq_hint": "AUGGGUAAA\u2026"}, {"stage": "Protein", "label": "EF-1\u03b1", "seq_hint": "MGKE\u2026"}]}, "PSI": {"id": "PSI", "name": "Public annotation marker (stub)", "role": "Placeholder for public-genome annotation only \u2014 no cultivation content", "steps": [{"stage": "DNA", "label": "annotated locus", "seq_hint": "public\u2026"}, {"stage": "RNA", "label": "transcript stub", "seq_hint": "public\u2026"}, {"stage": "Protein", "label": "product stub", "seq_hint": "\u2026"}]}};

<script src="js/map.js"></script>

</html>
